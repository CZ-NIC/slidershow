<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <script src="../../slidershow/slidershow.js"></script>
</head>

<body>
    <!-- Blurred backdrop (sli-backdrop, Frame.backdrop_paint): a portrait photo on a landscape screen,
         a text slide and an authored slide with a photo in it. -->
    <main>
        <article sli-src="portrait.png"></article>
        <article>
            <h1>Text only</h1>
        </article>
        <article>
            <img sli-src="portrait.png" style="height: 50%" />
            <p>Authored slide</p>
        </article>
    </main>
</body>

</html>
