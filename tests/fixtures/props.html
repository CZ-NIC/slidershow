<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <script src="../../slidershow/slidershow.js"></script>
</head>

<body>
    <main sli-duration="3" sli-rotate="90">
        <section sli-duration="2">
            <article id="a1" sli-duration="1">
                <p>one</p>
            </article>
            <article id="a2" sli-step-shown>
                <p>two</p>
            </article>
        </section>
        <section>
            <article id="a3" sli-playback-rate="7.5" sli-start="false">
                <p>three</p>
            </article>
        </section>
    </main>
</body>

</html>
