<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <script src="../../slidershow/slidershow.js"></script>
</head>

<body>
    <!-- Two image frames for the data saver (data_saver.js): the first has a sli-thumb to stand in for
         the original, the second has none, so there is nothing to fall back to and it stays unloaded.
         full.gif / thumb.gif are 1x1 GIFs sitting next to this file. -->
    <main>
        <section>
            <article>
                <img id="with-thumb" sli-src="full.gif" sli-thumb="thumb.gif" />
            </article>
            <article>
                <img id="no-thumb" sli-src="full.gif" />
            </article>
        </section>
    </main>
</body>

</html>
