<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <script src="../../slidershow/slidershow.js"></script>
</head>

<body>
    <!-- Two path-referenced videos (sli-src, no bytes) – enough for one to be "off-screen" (preloaded
         then unloaded, picking up sli-autoplay-prevented) while the other is the current frame. -->
    <main>
        <section>
            <article>
                <video sli-src="one.mp4"></video>
            </article>
            <article>
                <video sli-src="two.mp4"></video>
            </article>
        </section>
    </main>
</body>

</html>
