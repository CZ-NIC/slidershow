<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <script src="../../slidershow/slidershow.js"></script>
</head>

<body>
    <!-- Caption overlay (style.css `article > figcaption`): the first frame is converted from
         <article sli-src> (mediaConvert prepends the <img>), the second has its <img> written out. -->
    <main>
        <article sli-src="full.gif">
            <figcaption><i>Greetings!</i> <b>— Jane</b></figcaption>
        </article>
        <article>
            <img sli-src="full.gif" />
            <figcaption>Second</figcaption>
        </article>
    </main>
</body>

</html>
